<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>marriageProposal</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        /* DEFAULT BACKGROUND IMAGE */
        background-image: url('pic15.jpg');

        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        transition: background-image 0.5s ease-in-out;
        overflow: hidden; /* Prevent button from going outside page */
    }

    .box {
        background: rgba(255, 255, 255, 0.85);
        padding: 30px 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        animation: fadeIn 0.8s;
    }

    h1 {
        margin: 0 0 20px;
        font-size: 2rem;
        color: #d6336c;
    }

    button {
        padding: 12px 25px;
        font-size: 1.2rem;
        margin: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    #yesBtn {
        background: #d6336c;
        color: white;
    }

    #noBtn {
        position: absolute; /* Important for movement */
        background: #6c757d;
        color: white;
    }

    .back-btn {
        margin-top: 20px;
        padding: 10px 20px;
        background: gray;
        color: white;
        border-radius: 10px;
        cursor: pointer;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .confetti {
    position: fixed;
    top: -10px;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    opacity: 0.8;
    animation-name: fall;
    animation-timing-function: linear;
}

@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
}

</style>
</head>

<body>

<div class="box d-none" id="contentBox">

    <audio id="bgMusic">
  <source src="song.mp3" type="audio/mpeg">
</audio>
    
    

  
</div>

<script>
    window.addEventListener("load", function () {
    const audio = document.getElementById("bgMusic");

    // Try autoplay
    audio.play().then(() => {
        // Jump to a specific time (in seconds)
        audio.currentTime = 16;   // Start from 0:30
    }).catch(() => {
        // Autoplay blocked: show a button
        const btn = document.createElement("button");
        btn.innerText = "Play Music 🎵";
        btn.style.fontSize = "20px";
        btn.onclick = () => {
            audio.currentTime = 16; // Set time before playing
            audio.play();
            btn.remove();
        };
        document.body.appendChild(btn);
    });
});


</script>

</body>
</html>
